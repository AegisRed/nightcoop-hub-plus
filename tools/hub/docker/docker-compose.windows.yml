# Windows / Docker Desktop: standalone Compose file.
# No network_mode: Docker Compose uses its default bridge network.
# Start: docker compose -f docker-compose.windows.yml up -d --build
# Port 47800 is fixed; NIGHTCOOP_WINDOWS_SHARDS must be 1..16.
services:
  hub:
    image: ${NIGHTCOOP_IMAGE:-nightcoop-hub:local}
    build:
      context: ../../..
      dockerfile: tools/hub/docker/Dockerfile
    container_name: nightcoop-hub
    restart: unless-stopped
    ports:
      - "47800:47800/udp"
      - "47810-47824:47810-47824/udp"
    command: >-
      47800
      --shards ${NIGHTCOOP_WINDOWS_SHARDS:-4}
      --max-clients ${NIGHTCOOP_MAX_CLIENTS:-512}
      --sign-key-auto /data/hub-sign.key
      --hub-name ${NIGHTCOOP_HUB_NAME:-localhost}
      --region ${NIGHTCOOP_REGION:-home}
      ${NIGHTCOOP_EXTRA_ARGS:-}
    volumes:
      - hub-data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    pids_limit: 128
    ulimits:
      nofile: 4096
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  hub-data:
    name: nightcoop-hub-data
